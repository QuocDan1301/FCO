<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<script id="screen-fit">
      // Mọi màn cảm ứng dùng đúng bố cục PC: dựng trang ở khung tối thiểu W×H (cỡ PC chuẩn) rồi thu nhỏ cho vừa màn thật.
      // Máy tính bỏ qua thẻ viewport nên không đổi. Điện thoại cầm dọc giữ khung thường để màn yêu cầu xoay ngang đọc được.
      (function () {
        // Điện thoại và máy bảng dùng đúng khung PC (cửa sổ 1536×826) để giao diện giống hệt máy tính.
        var W = 1536, H = 826;
        // Máy có màn cảm ứng: điện thoại / máy bảng (kể cả máy Samsung có bút S Pen, Samsung Internet, DeX báo "có rê chuột").
        // Máy tính có màn cảm ứng cũng khớp nhưng trình duyệt máy tính bỏ qua thẻ viewport nên không đổi gì.
        var touch = matchMedia("(pointer: coarse)").matches || matchMedia("(any-pointer: coarse)").matches || (navigator.maxTouchPoints || 0) > 0;
        if (!touch) return;
        var meta = document.querySelector('meta[name="viewport"]'), last = "";
        function fit(recheck) {
          // Bàn phím mở làm màn thấp đi: giữ nguyên, nếu không giao diện sẽ thu nhỏ thêm lúc đang gõ.
          var active = document.activeElement && document.activeElement.tagName;
          if (last && (active === "INPUT" || active === "TEXTAREA")) return;
          var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
          var landscape = matchMedia("(orientation: landscape)").matches, content, scale = 1;
          if (!landscape && short <= 600) content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover";
          else {
            // Vùng thật đang hiện trang (đơn vị px thiết bị): trừ thanh địa chỉ, thanh trạng thái, thanh điều hướng.
            // Không dùng screen.width/height vì gồm cả các thanh đó → trang bị phóng quá, mất thanh dưới và mép phải.
            // visualViewport.scale là tỉ lệ đang áp nên width × scale luôn ra px thiết bị, kể cả khi thẻ viewport vừa đổi.
            var vv = window.visualViewport, z = vv && vv.scale > 0 ? vv.scale : (window.__FCO_FIT_SCALE || 1);
            var vw = vv ? vv.width * z : window.innerWidth * z, vh = vv ? vv.height * z : window.innerHeight * z;
            if (!(vw > 0 && vh > 0)) { vw = long; vh = short; }
            // Khung rộng đủ để chiều cao vừa H (làm tròn 10 px để thanh địa chỉ nhích nhẹ không dựng lại cả trang),
            // tối thiểu W; tỉ lệ thu nhỏ theo bề ngang vùng hiện → cả chiều ngang lẫn chiều dọc đều vừa.
            var width = Math.max(W, Math.ceil((H * vw / vh) / 10) * 10);
            scale = Math.floor(vw / width * 10000) / 10000;
            var s = scale.toFixed(4);
            content = "width=" + width + ", initial-scale=" + s + ", minimum-scale=" + s + ", maximum-scale=" + s + ", user-scalable=no, viewport-fit=cover";
          }
          window.__FCO_FIT_SCALE = scale;
          // Trang bị thu nhỏ còn `scale` lần nên env(safe-area-inset-*) (tính theo px của trang) chỉ còn scale × độ cao thật của vạch Home /
          // tai thỏ trên màn → CSS nhân thêm --fit-inv để chừa đủ (người dùng 2026-11-17: kiểm tra giao diện mọi iPhone, dock đè vạch Home).
          var rootEl = document.documentElement;
          if (rootEl && rootEl.style) rootEl.style.setProperty("--fit-inv", (1 / (scale || 1)).toFixed(4));
          if (content !== last) {
            last = content; meta.setAttribute("content", content);
            // Ngay sau khi đổi thẻ viewport, trình duyệt có lúc đã đổi visualViewport.scale nhưng chưa đổi width → lần đo đó ra tỉ lệ
            // quá nhỏ (vd 0,18 thay vì 0,43: cả trang thu còn nửa màn) và kẹt luôn vì không còn sự kiện resize nào
            // (kiểm tra giao diện Android 2026-11-22). Đo lại khi số đã ổn định; khung đúng rồi thì lần đo lại không đổi gì.
            // Lần đo lại không hẹn thêm lần nào (tránh vòng lặp ở trình duyệt bỏ qua thẻ viewport).
            if (recheck !== 1) {
              clearTimeout(fit.t1); clearTimeout(fit.t2);
              fit.t1 = setTimeout(function () { fit(1); }, 250); fit.t2 = setTimeout(function () { fit(1); }, 1000);
            }
          }
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", function () { setTimeout(fit, 250); });
        if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
      })();
    </script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
