<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script id="screen-fit">
      // Mọi màn cảm ứng dùng đúng bố cục PC: dựng trang ở khung tối thiểu W×H (cỡ PC chuẩn) rồi thu nhỏ cho vừa màn thật.
      // Máy tính bỏ qua thẻ viewport nên không đổi. Điện thoại cầm dọc giữ khung thường để màn yêu cầu xoay ngang đọc được.
      (function () {
        // Máy bảng dùng đúng khung PC; điện thoại dùng khung nhỏ hơn để chữ và nút to hơn khoảng 20%.
        var W = 1536, H = 826, PHONE_W = 1280, PHONE_H = 688;
        if (!matchMedia("(hover: none) and (pointer: coarse)").matches) return;
        var meta = document.querySelector('meta[name="viewport"]'), last = "";
        function fit() {
          // Bàn phím mở làm màn thấp đi: giữ nguyên, nếu không giao diện sẽ thu nhỏ thêm lúc đang gõ.
          var active = document.activeElement && document.activeElement.tagName;
          if (last && (active === "INPUT" || active === "TEXTAREA")) return;
          var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
          var phone = short <= 600, minW = phone ? PHONE_W : W, minH = phone ? PHONE_H : H;
          var landscape = matchMedia("(orientation: landscape)").matches, content, scale = 1;
          if (!landscape && short <= 600) content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover";
          else {
            var aspect = window.innerHeight ? window.innerWidth / window.innerHeight : long / short;
            // Làm tròn 10 px để thanh địa chỉ nhích nhẹ không làm cả trang dựng lại.
            var width = Math.max(minW, Math.ceil((minH * aspect) / 10) * 10);
            scale = (landscape ? long : short) / width;
            var s = scale.toFixed(4);
            content = "width=" + width + ", initial-scale=" + s + ", minimum-scale=" + s + ", maximum-scale=" + s + ", user-scalable=no, viewport-fit=cover";
          }
          // Đánh dấu điện thoại cầm ngang để CSS giữ thanh menu dưới cỡ PC dù khung chỉ cao 688px.
          document.documentElement.classList.toggle("fit-phone", phone && landscape);
          window.__FCO_FIT_SCALE = scale;
          if (content !== last) { last = content; meta.setAttribute("content", content); }
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&amp;display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#080b10" />
    <meta
      name="description"
      content="FCO VIP — Mở gói cầu thủ, nâng cấp thẻ và xây dựng bộ sưu tập. Trò chơi giả lập miễn phí bằng tiếng Việt."
    />
    <title>FCO VIP · Bức phá giới hạn</title>
    <link rel="icon" type="image/png" href="/assets/fco-vip-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #080b10;
        color: #f0f1f3;
        font-family: "Roboto Condensed", Arial, sans-serif;
      }
      .boot-content {
        width: min(360px, 100%);
        text-align: center;
      }
      .boot-logo {
        display: block;
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin: 0 auto 24px;
      }
      .boot-content h1 {
        font-size: 24px;
        letter-spacing: 2px;
        margin: 0 0 12px;
      }
      .boot-content p {
        font-size: 14px;
        color: #b8bcc5;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .boot-track {
        height: 5px;
        background: #252b34;
        border-radius: 3px;
        overflow: hidden;
      }
      .boot-fill {
        height: 100%;
        width: 0;
        background: #d9ba76;
        transition: width 0.15s;
      }
      .boot-detail {
        display: block;
        margin: 12px 0 24px;
        color: #b8bcc5;
        font-size: 12px;
        min-height: 16px;
      }
      .boot-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 180px;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid #625536;
        border-radius: 4px;
        background: #242016;
        color: #e5cf9a;
        font-size: 14px;
      }
      .boot-action:disabled {
        cursor: wait;
        opacity: 1;
      }
      .boot-action:not(:disabled) {
        cursor: pointer;
      }
      .boot-action:focus-visible {
        outline: 2px solid #e5cf9a;
        outline-offset: 4px;
      }
      .boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #625536;
        border-top-color: #e5cf9a;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-action[hidden] {
        display: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
        .boot-fill {
          transition: none;
        }
      }

      /* Điện thoại cầm dọc: game chỉ chơi ngang, che toàn bộ trang và nhắc xoay máy (máy tính bảng, máy tính không bị chặn). */
      #rotate-gate {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 600px) and (hover: none) and (pointer: coarse) {
        #rotate-gate {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          padding: 24px;
          background: radial-gradient(circle at 50% 40%, #142233, #05080d 70%);
          color: #f0f1f3;
          text-align: center;
          font-family: "Roboto Condensed", Arial, sans-serif;
        }
        body {
          overflow: hidden;
        }
      }
      #rotate-gate .rotate-phone {
        width: 64px;
        height: 108px;
        border: 4px solid #d9ba76;
        border-radius: 12px;
        position: relative;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }
      #rotate-gate .rotate-phone::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 6px;
        width: 14px;
        height: 4px;
        margin-left: -7px;
        border-radius: 2px;
        background: #d9ba76;
      }
      #rotate-gate h2 {
        margin: 6px 0 0;
        font-size: 22px;
      }
      #rotate-gate p {
        margin: 0;
        max-width: 300px;
        font-size: 15px;
        line-height: 1.5;
        color: #aebdcc;
      }
      #rotate-gate button {
        display: none;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        background: #d9ba76;
        color: #1d160b;
        font:
          700 15px "Roboto Condensed",
          Arial,
          sans-serif;
        cursor: pointer;
      }
      #rotate-gate.can-lock button {
        display: inline-block;
      }
      @keyframes rotate-hint {
        0%,
        20% {
          transform: rotate(0);
        }
        50%,
        80% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate-gate .rotate-phone {
          animation: none;
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-gate" role="alert" aria-live="polite">
      <div class="rotate-phone" aria-hidden="true"></div>
      <h2>Xoay ngang điện thoại</h2>
      <p>
        FCO VIP chỉ chơi ở chế độ màn hình ngang. Hãy xoay ngang điện thoại (và
        tắt khoá xoay màn hình nếu đang bật) để vào game.
      </p>
      <button type="button" id="rotate-lock">
        Toàn màn hình &amp; xoay ngang
      </button>
    </div>
    <script>
      // Android Chrome: vào toàn màn hình rồi khoá hướng ngang bằng một chạm. iPhone không hỗ trợ khoá hướng nên ẩn nút.
      (function () {
        var gate = document.getElementById("rotate-gate"),
          button = document.getElementById("rotate-lock");
        if (
          !gate ||
          !button ||
          !(screen.orientation && screen.orientation.lock) ||
          !document.documentElement.requestFullscreen
        )
          return;
        gate.classList.add("can-lock");
        button.addEventListener("click", function () {
          document.documentElement
            .requestFullscreen({ navigationUI: "hide" })
            .then(function () {
              return screen.orientation.lock("landscape");
            })
            .catch(function () {
              gate.classList.remove("can-lock");
            });
        });
      })();
    </script>
    <div
      id="startup"
      class="boot-screen"
      aria-labelledby="boot-title"
      aria-busy="true"
    >
      <div class="boot-content">
        <img
          class="boot-logo"
          src="/assets/fco-vip-logo.png"
          alt=""
          width="96"
          height="96"
        />
        <h1 id="boot-title">FCO VIP</h1>
        <p id="boot-status" role="status">Đang tải game…</p>
        <div
          id="boot-progress"
          class="boot-track"
          role="progressbar"
          aria-label="Tiến độ tải game"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div id="boot-fill" class="boot-fill"></div>
        </div>
        <span id="boot-detail" class="boot-detail"
          >Đang tải dữ liệu trò chơi</span
        >
        <button id="boot-loading" class="boot-action" type="button" disabled>
          <span class="boot-spinner" aria-hidden="true"></span>Đang tải…
        </button>
        <button
          id="boot-retry"
          class="boot-action"
          type="button"
          hidden
          onclick="location.reload()"
        >
          Thử lại
        </button>
      </div>
    </div>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
      onerror="
        document.getElementById('boot-status').textContent =
          'Không tải được game. Hãy kiểm tra kết nối rồi thử lại.';
        document.getElementById('boot-loading').hidden = true;
        document.getElementById('boot-retry').hidden = false;
        document.getElementById('startup').setAttribute('aria-busy', 'false');
      "
    ></script>
  </body>
</html>
